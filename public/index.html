<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de usuarios</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 950px;
      margin: 30px auto;
      padding: 20px;
    }

    section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    input, button {
      padding: 8px;
      margin: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    .mensaje {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Gestor de usuarios</h1>

  <section>
    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Correo" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="submit">Iniciar sesión</button>
      <button type="button" onclick="logout()">Cerrar sesión</button>
    </form>

    <p id="sessionStatus">No has iniciado sesión.</p>
  </section>

  <section>
    <h2>CRUD de usuarios</h2>

    <form id="userForm">
      <input type="hidden" id="userId">

      <input type="text" id="name" placeholder="Nombre" required>
      <input type="email" id="email" placeholder="Correo" required>
      <input type="password" id="password" placeholder="Contraseña">

      <button type="submit">Guardar usuario</button>
      <button type="button" onclick="clearForm()">Cancelar</button>
    </form>

    <p class="mensaje" id="message"></p>

    <h3>Lista de usuarios</h3>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </section>

  <script>
    const form = document.getElementById('userForm');
    const loginForm = document.getElementById('loginForm');
    const usersTable = document.getElementById('usersTable');
    const message = document.getElementById('message');
    const sessionStatus = document.getElementById('sessionStatus');

    async function checkSession() {
      const response = await fetch('/api/session');
      const result = await response.json();

      if (result.authenticated) {
        sessionStatus.textContent = 'Sesión iniciada como: ' + result.user.name + ' (' + result.user.email + ')';
      } else {
        sessionStatus.textContent = 'No has iniciado sesión.';
      }
    }

    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();
      sessionStatus.textContent = result.mensaje;

      checkSession();
    });

    async function logout() {
      const response = await fetch('/api/logout', {
        method: 'POST'
      });

      const result = await response.json();
      sessionStatus.textContent = result.mensaje;

      checkSession();
    }

    async function loadUsers() {
      const response = await fetch('/api/users');
      const users = await response.json();

      usersTable.innerHTML = '';

      users.forEach(function(user) {
        const row = document.createElement('tr');

        row.innerHTML =
          '<td>' + user.id + '</td>' +
          '<td>' + user.name + '</td>' +
          '<td>' + user.email + '</td>' +
          '<td>' +
          '<button onclick="editUser(' + user.id + ', \'' + user.name + '\', \'' + user.email + '\')">Editar</button>' +
          '<button onclick="deleteUser(' + user.id + ')">Eliminar</button>' +
          '</td>';

        usersTable.appendChild(row);
      });
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const id = document.getElementById('userId').value;
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const data = id ? { name, email } : { name, email, password };
      const url = id ? '/api/users/' + id : '/api/users';
      const method = id ? 'PUT' : 'POST';

      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (!response.ok) {
        message.textContent = result.mensaje;
        return;
      }

      message.textContent = id ? 'Usuario actualizado correctamente.' : 'Usuario creado correctamente.';
      clearForm();
      loadUsers();
    });

    function editUser(id, name, email) {
      document.getElementById('userId').value = id;
      document.getElementById('name').value = name;
      document.getElementById('email').value = email;
      document.getElementById('password').value = '';
      message.textContent = 'Editando usuario seleccionado.';
    }

    async function deleteUser(id) {
      const response = await fetch('/api/users/' + id, {
        method: 'DELETE'
      });

      const result = await response.json();
      message.textContent = result.mensaje;
      loadUsers();
    }

    function clearForm() {
      document.getElementById('userId').value = '';
      form.reset();
    }

    loadUsers();
    checkSession();
  </script>
</body>
</html>
